name: Release

# Pushing a tag vX.Y.Z publishes the Docker image to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y, :sha-<short> (and :latest for stable tags)
# for linux/amd64 and linux/arm64, with an SBOM and max-mode build provenance attached.
#
# Safeguards: the whole CI workflow (lint, types, tests, reproduction, notebook, Docker
# smoke test) runs first on the tagged commit and must pass (`needs: ci`); the publishing
# job runs in the `release` environment, which should require a reviewer's approval
# (Settings -> Environments -> release -> Required reviewers; docs/DEPLOYMENT.md); and the
# published image is built from scratch (`no-cache`), never from cached layers.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches the package version
        shell: bash
        run: |
          pkg_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: $pkg_version, tag: $tag_version"
          test "$pkg_version" = "$tag_version"
          echo "VERSION=$pkg_version" >> "$GITHUB_ENV"

      # Registry paths must be lower-case; github.repository keeps the owner's casing.
      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=battery-soh
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          # The published image is built from scratch: no layer comes from a cache that a
          # pull-request build could have written.
          no-cache: true

      - name: Summary
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
