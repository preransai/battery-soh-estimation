name: CI

# Every action is pinned to a full commit SHA (the `# vX.Y.Z` comment names the release);
# Dependabot keeps the pins and comments up to date. Every `pip install` uses
# requirements/constraints.txt: the exact package versions that produced the committed
# results, so the committed-artifact tests in the test job check that they reproduce.
#
# Also called by release.yml (workflow_call): a tag is only published after this whole
# workflow passed on exactly that commit. Pages deploys after it succeeds on main
# (pages.yml, workflow_run).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR/branch supersedes the running checks. Runs on main are
# never cancelled, so every commit on main keeps a complete record. The group name has
# its own prefix so that a call from release.yml never shares the caller's group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  # scikit-learn's OpenMP pools oversubscribe small runners; one thread per process
  # avoids that and keeps runtimes predictable.
  OMP_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install
        run: python -m pip install -e ".[dev]" -c requirements/constraints.txt
      - name: ruff check
        run: ruff check --output-format=github src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy --strict
        run: mypy src/battery_soh
      # The Docker image installs requirements/runtime.lock (hashed, universal). Regenerate
      # it with the pinned uv and the recorded command; any difference means the lock is
      # stale with respect to pyproject.toml or requirements/constraints.txt.
      - name: requirements/runtime.lock is up to date
        run: |
          python -m pip install uv -c requirements/constraints.txt
          uv pip compile pyproject.toml --extra api --universal --python-version 3.11 \
            --generate-hashes -c requirements/constraints.txt -o requirements/runtime.lock --quiet
          git diff --exit-code -- requirements/runtime.lock

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install
        run: python -m pip install -e ".[dev]" -c requirements/constraints.txt
      # Raw NASA .mat files (~200 MB) are not in git; tests that need them are marked
      # raw_data. Everything else, including the API and the committed feature table,
      # is exercised here. With the pinned versions this includes the committed-artifact
      # tests (tests/integration): the committed reports, model bundles and generated docs
      # must be exactly what the code produces, i.e. the results reproduce.
      - name: pytest
        run: >-
          python -m pytest -m "not raw_data"
          --cov=battery_soh --cov-report=term --cov-report=xml:coverage.xml
          --junitxml=junit.xml
      - name: Upload coverage and test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 14

  reproduce:
    name: Reproduce audit + quick benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install (runtime dependencies only)
        run: python -m pip install -e . -c requirements/constraints.txt
      - name: Committed feature table is present
        run: |
          test -s data/processed/nasa_features.csv
          wc -l data/processed/nasa_features.csv
      # Outputs go to the runner's temp directory, so the committed reports are never
      # touched and the results below come only from this run.
      - name: soh audit
        run: soh audit --out-dir "$RUNNER_TEMP/audit" > "$RUNNER_TEMP/audit.stdout.json"
      - name: soh benchmark --quick
        run: soh benchmark --quick --out-dir "$RUNNER_TEMP/benchmark" > "$RUNNER_TEMP/benchmark.stdout.json"
      - name: Job summary
        run: |
          {
            echo "### Reproduced from \`data/processed/nasa_features.csv\`"
            echo
            echo "sha256: \`$(sha256sum data/processed/nasa_features.csv | cut -d' ' -f1)\`"
            echo
            echo "<details><summary>soh audit</summary>"
            echo
            echo '```json'
            head -c 20000 "$RUNNER_TEMP/audit.stdout.json"
            echo
            echo '```'
            echo "</details>"
            echo
            echo "<details><summary>soh benchmark --quick</summary>"
            echo
            echo '```json'
            head -c 20000 "$RUNNER_TEMP/benchmark.stdout.json"
            echo
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproduce-results
          path: |
            ${{ runner.temp }}/audit
            ${{ runner.temp }}/benchmark
          if-no-files-found: error
          retention-days: 14

  notebook:
    name: Walkthrough notebook executes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      - name: Install (notebook extra)
        run: python -m pip install -e ".[notebook]" -c requirements/constraints.txt
      # Runs every cell against the committed feature table, reports and model bundles.
      # nbconvert fails on the first cell that raises, so a library, API or artifact change
      # the notebook was not updated for fails this job. It checks that the notebook runs;
      # it does not compare the new outputs with the committed ones. The executed copy
      # goes to /tmp; the committed notebook is never rewritten.
      - name: Execute notebooks/01_walkthrough.ipynb
        env:
          OMP_NUM_THREADS: "1"
        run: >-
          jupyter nbconvert --to notebook --execute notebooks/01_walkthrough.ipynb
          --output /tmp/executed.ipynb

  docker:
    name: Docker image (build, run read-only, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: battery-soh:ci
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max,ignore-error=true
      - name: Start container (read-only root FS, no capabilities)
        run: |
          docker run --detach --name soh --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 512m --cpus 1 \
            "$IMAGE"
      - name: Wait for /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "$BASE_URL/readyz"; then
              echo
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' soh)" != "true" ]; then
              echo "container exited"
              break
            fi
            sleep 2
          done
          docker logs soh
          exit 1
      # The fixture holds the 8 'combined' health indicators of NASA B0005 around
      # discharge cycle 80 (measured SOH ~85 %).
      - name: POST /v1/soh/estimate with the sample request
        run: |
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data @.github/fixtures/sample_estimate_request.json \
            "$BASE_URL/v1/soh/estimate")
          cat response.json
          echo
          test "$status" = "200" || { echo "expected HTTP 200, got $status"; exit 1; }
          python3 - <<'EOF'
          import json
          body = json.load(open("response.json"))
          soh = body["soh_pct"]
          lo, hi = body["interval"]["lower"], body["interval"]["upper"]
          assert 0.0 <= soh <= 120.0, soh
          assert lo <= soh <= hi, (lo, soh, hi)
          print(f"soh_pct={soh:.2f} interval=[{lo:.2f}, {hi:.2f}] model={body['model_id']}")
          EOF
      - name: Hardening checks
        run: |
          test "$(docker exec soh id -u)" = "10001" || { echo "not running as uid 10001"; exit 1; }
          if docker exec soh sh -c 'touch /app/probe' 2>/dev/null; then
            echo "/app is writable"; exit 1
          fi
          curl --fail --silent --show-error --dump-header headers.txt --output /dev/null "$BASE_URL/readyz"
          cat headers.txt
          for header in content-security-policy x-content-type-options x-request-id; do
            grep -q -i "^$header:" headers.txt || { echo "missing response header: $header"; exit 1; }
          done
      - name: HEALTHCHECK turns healthy
        run: |
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' soh)
            echo "health: $health"
            [ "$health" = "healthy" ] && exit 0
            [ "$health" = "unhealthy" ] && break
            sleep 5
          done
          docker inspect --format '{{json .State.Health}}' soh
          exit 1
      - name: Image size to job summary
        if: ${{ !cancelled() }}
        run: |
          bytes=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          {
            echo "### Docker image"
            echo
            echo "| image | size |"
            echo "|---|---|"
            echo "| \`$IMAGE\` | $(awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1000000 }') |"
            echo
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" | cut -c1-160
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: ${{ always() }}
        run: docker logs soh || true
      - name: Stop container
        if: ${{ always() }}
        run: docker rm --force soh || true
