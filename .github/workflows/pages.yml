name: Pages

# Publishes the backend-free static build of the web UI (precomputed benchmark, audit,
# model cards and demo cycles) to GitHub Pages. One-time setup: Settings -> Pages ->
# Source: "GitHub Actions".
#
# Gated on CI: it runs when the CI workflow completes for a push to main, deploys only if
# CI succeeded, and builds exactly the commit CI tested. A manual run (workflow_dispatch)
# deploys the selected ref as it is; use it only for a ref whose CI is green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build static site
    # workflow_run: only a successful CI run of a push to main in this repository (never a
    # pull request from a fork whose branch happens to be called main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit CI tested (workflow_run), or the selected ref (manual run).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      # The exporter lives in the battery_soh.api package, so the [api] extra is
      # installed alongside the core package.
      - name: Install
        run: python -m pip install -e ".[api]" -c requirements/constraints.txt
      - name: soh export-static
        run: soh export-static --out-dir site
      - name: Check the export
        run: |
          test -s site/index.html
          echo "files: $(find site -type f | wc -l), size: $(du -sh site | cut -f1)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
