name: Pages

# Publishes the backend-free static build of the web UI (precomputed benchmark, audit,
# model cards and demo cycles) to GitHub Pages. One-time setup: Settings -> Pages ->
# Source: "GitHub Actions".
#
# Gated on CI: it runs when the CI workflow completes for a push to main, deploys only if
# CI succeeded, and builds exactly the commit CI tested. A manual run (workflow_dispatch)
# deploys the selected ref as it is; use it only for a ref whose CI is green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build static site
    # workflow_run: only a successful CI run of a push to main in this repository (never a
    # pull request from a fork whose branch happens to be called main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The commit CI tested (workflow_run), or the selected ref (manual run).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt
      # The exporter lives in the battery_soh.api package, so the [api] extra is
      # installed alongside the core package.
      - name: Install
        run: python -m pip install -e ".[api]" -c requirements/constraints.txt
      - name: soh export-static
        run: soh export-static --out-dir site
      - name: Check the export
        run: |
          test -s site/index.html
          echo "files: $(find site -type f | wc -l), size: $(du -sh site | cut -f1)"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
